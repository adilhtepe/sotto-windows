name: ci
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  driver:
    name: driver (${{ matrix.platform }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Windows Driver Kit
        shell: pwsh
        run: |
          $kits = "${env:ProgramFiles(x86)}\Windows Kits\10"
          if (-not (Test-Path "$kits\build\*\WindowsDriver.Common.targets")) {
          winget install --source winget --exact --id Microsoft.WindowsWDK.10.0.26100 --accept-package-agreements --accept-source-agreements --silent
          $vsix = Get-ChildItem "$kits\Vsix" -Recurse -Filter WDK.vsix | Select-Object -First 1
          $installer = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property productPath | Split-Path
          Start-Process -Wait "$installer\VSIXInstaller.exe" -ArgumentList "/quiet", "/admin", $vsix.FullName
          }
          # Build against the newest kit that has both the WDK and the matching SDK headers
          $ver = Get-ChildItem "$kits\build" -Directory | Where-Object {
              (Test-Path "$($_.FullName)\WindowsDriver.Common.targets") -and (Test-Path "$kits\Include\$($_.Name)\km")
          } | Sort-Object { [version]$_.Name } | Select-Object -Last 1 -ExpandProperty Name
          if (-not $ver) { Write-Error "no WDK found"; exit 1 }
          Write-Host "WDK $ver"
          "WDKVER=$ver" >> $env:GITHUB_ENV
          # Inf2Cat (bin\<ver>\x86) loads "x86\InfVerif.dll" relative to itself; some WDK installs lack it there.
          $x86 = "$kits\bin\$ver\x86"
          $all = Get-ChildItem $kits -Recurse -Filter InfVerif.dll -ErrorAction SilentlyContinue
          $all | ForEach-Object { Write-Host "found $($_.FullName)" }
          $dll = ($all | Where-Object { $_.FullName -match '\\x86\\' } | Select-Object -First 1)
          if (-not $dll) { $dll = $all | Select-Object -First 1 }
          if ($dll) {
              New-Item -ItemType Directory -Force "$x86\x86" | Out-Null
              Copy-Item -Force $dll.FullName "$x86\x86\InfVerif.dll"
              Write-Host "InfVerif.dll -> $x86\x86"
          } else {
              # No INF verifier on this image: build and sign the driver, skip the catalog.
              "INF2CAT=/p:EnableInf2cat=false" >> $env:GITHUB_ENV
              "No InfVerif.dll in the WDK on this runner: built without the .cat catalog." >> $env:GITHUB_STEP_SUMMARY
          }
      - name: Build (test-signed)
        shell: pwsh
        run: |
          $extra = @(); if ($env:INF2CAT) { $extra += $env:INF2CAT }
          msbuild SottoVBAN\Scream.vcxproj /p:Configuration=Win10 /p:Platform=${{ matrix.platform }} /p:SpectreMitigation=false /p:WindowsTargetPlatformVersion=$env:WDKVER @extra /m
      - uses: actions/upload-artifact@v4
        with:
          name: SottoVBAN-${{ matrix.platform }}
          path: |
            SottoVBAN/${{ matrix.platform }}/**/SottoVBAN.sys
            SottoVBAN/${{ matrix.platform }}/**/SottoVBAN.inf
            SottoVBAN/${{ matrix.platform }}/**/*.cat
            SottoVBAN/${{ matrix.platform }}/**/*.cer
            install.bat
