name: ci
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  driver:
    name: driver (${{ matrix.platform }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64   # the WDK's InfVerif task ships only x64/arm64 DLLs
      - name: Windows Driver Kit
        shell: pwsh
        run: |
          $kits = "${env:ProgramFiles(x86)}\Windows Kits\10"
          if (-not (Test-Path "$kits\build\*\WindowsDriver.Common.targets")) {
          winget install --source winget --exact --id Microsoft.WindowsWDK.10.0.26100 --accept-package-agreements --accept-source-agreements --silent
          $vsix = Get-ChildItem "$kits\Vsix" -Recurse -Filter WDK.vsix | Select-Object -First 1
          $installer = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property productPath | Split-Path
          Start-Process -Wait "$installer\VSIXInstaller.exe" -ArgumentList "/quiet", "/admin", $vsix.FullName
          }
          # Build against the newest kit that has both the WDK and the matching SDK headers
          $ver = Get-ChildItem "$kits\build" -Directory | Where-Object {
              (Test-Path "$($_.FullName)\WindowsDriver.Common.targets") -and (Test-Path "$kits\Include\$($_.Name)\km")
          } | Sort-Object { [version]$_.Name } | Select-Object -Last 1 -ExpandProperty Name
          if (-not $ver) { Write-Error "no WDK found"; exit 1 }
          Write-Host "WDK $ver"
          "WDKVER=$ver" >> $env:GITHUB_ENV
      - name: Build (test-signed)
        shell: pwsh
        run: |
          msbuild SottoVBAN\Scream.vcxproj /p:Configuration=Win10 /p:Platform=${{ matrix.platform }} /p:SpectreMitigation=false /p:WindowsTargetPlatformVersion=$env:WDKVER /m
      - name: Package (driver, test certificate, installer)
        shell: pwsh
        run: |
          $p = "pkg\SottoVBAN-${{ matrix.platform }}"
          New-Item -ItemType Directory -Force $p | Out-Null
          Copy-Item "SottoVBAN\${{ matrix.platform }}\Win10\Scream\*" $p
          Copy-Item "SottoVBAN\${{ matrix.platform }}\Win10\SottoVBAN.cer" $p
          Copy-Item install.bat, install.ps1, uninstall.bat, README.md, LICENSE-MS-PL.txt $p
          Get-ChildItem $p | Format-Table Name, Length
      - name: Install, check the device starts, uninstall (the runner has test signing on)
        if: matrix.platform == 'x64'   # the runner is x64; the ARM64 driver cannot load on it
        shell: pwsh
        run: |
          $ps = "pkg\SottoVBAN-${{ matrix.platform }}\install.ps1"
          # fresh install (options written before the service exists), then a reinstall over it
          powershell -NoProfile -ExecutionPolicy Bypass -File $ps -Ip 127.0.0.1 -Stream CI
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # reinstall: the idle driver unloads when its device goes, so this must succeed
          powershell -NoProfile -ExecutionPolicy Bypass -File $ps -Ip 127.0.0.2 -Stream CI2
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ItemProperty HKLM:\SYSTEM\CurrentControlSet\Services\SottoVBAN\Options | Format-List UnicastIPv4, StreamName
          $n = @(Get-PnpDevice | Where-Object { $_.HardwareID -contains '*SottoVBAN' -and $_.Present }).Count
          if ($n -ne 1) { Write-Error "expected one device, found $n"; exit 1 }
          $d = Get-PnpDevice | Where-Object { $_.HardwareID -contains '*SottoVBAN' }
          $d | Format-Table FriendlyName, Status, InstanceId
          if (-not $d -or $d.Status -ne 'OK') { Write-Error "device did not start"; exit 1 }
          Get-CimInstance Win32_SystemDriver -Filter "Name='SottoVBAN'" | Format-Table Name, State, PathName
          # Audio test: start the Windows audio service, play a sound through Sotto out, count the
          # VBAN packets on 127.0.0.2:6980 (the installer above pointed the driver there, stream CI2)
          Set-Service AudioEndpointBuilder -StartupType Manual; Set-Service Audiosrv -StartupType Manual
          Start-Service AudioEndpointBuilder, Audiosrv
          Start-Sleep 3
          Get-PnpDevice -Class AudioEndpoint -ErrorAction SilentlyContinue | Format-Table FriendlyName, Status
          $job = Start-Job { python $using:PWD\ci\vban_listen.py 6980 12 }
          Start-Sleep 2
          $wav = Get-ChildItem C:\Windows\Media\*.wav | Select-Object -First 1
          Write-Host "playing $($wav.Name)"
          for ($k = 0; $k -lt 3; $k++) { (New-Object Media.SoundPlayer $wav.FullName).PlaySync() }
          $out = Receive-Job $job -Wait
          $out
          if (-not ($out -match 'packets [1-9]')) { Write-Error "no VBAN packets"; exit 1 }
          if (-not ($out -match 'frames 64 ')) { Write-Error "expected 64 frames per packet (the driver default)"; exit 1 }
          # Restart the device while it plays (this crashed a desktop before the per-stream work
          # item fix), then check that audio still flows
          $play = Start-Job { param($f) for ($k = 0; $k -lt 6; $k++) { (New-Object Media.SoundPlayer $f).PlaySync() } } -ArgumentList $wav.FullName
          Start-Sleep 2
          $d = Get-PnpDevice | Where-Object { $_.HardwareID -contains '*SottoVBAN' -and $_.Present }
          for ($k = 0; $k -lt 3; $k++) {
              & pnputil /restart-device "$($d.InstanceId)"
              Start-Sleep 2
          }
          Stop-Job $play -ErrorAction SilentlyContinue
          Start-Sleep 2
          $job = Start-Job { python $using:PWD\ci\vban_listen.py 6980 10 }
          Start-Sleep 2
          for ($k = 0; $k -lt 2; $k++) { (New-Object Media.SoundPlayer $wav.FullName).PlaySync() }
          $out = Receive-Job $job -Wait
          "after restarts: $out"
          if (-not ($out -match 'packets [1-9]')) { Write-Error "no VBAN packets after restarting the device"; exit 1 }
          powershell -NoProfile -ExecutionPolicy Bypass -File $ps -Uninstall
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (Get-PnpDevice | Where-Object { $_.HardwareID -contains '*SottoVBAN' -and $_.Present }) { Write-Error "device still present"; exit 1 }
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: SottoVBAN-${{ matrix.platform }}
          path: pkg/SottoVBAN-${{ matrix.platform }}
