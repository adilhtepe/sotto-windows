name: ci
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  driver:
    name: driver (${{ matrix.platform }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64   # the WDK's InfVerif task ships only x64/arm64 DLLs
      - name: Windows Driver Kit
        shell: pwsh
        run: |
          $kits = "${env:ProgramFiles(x86)}\Windows Kits\10"
          if (-not (Test-Path "$kits\build\*\WindowsDriver.Common.targets")) {
          winget install --source winget --exact --id Microsoft.WindowsWDK.10.0.26100 --accept-package-agreements --accept-source-agreements --silent
          $vsix = Get-ChildItem "$kits\Vsix" -Recurse -Filter WDK.vsix | Select-Object -First 1
          $installer = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property productPath | Split-Path
          Start-Process -Wait "$installer\VSIXInstaller.exe" -ArgumentList "/quiet", "/admin", $vsix.FullName
          }
          # Build against the newest kit that has both the WDK and the matching SDK headers
          $ver = Get-ChildItem "$kits\build" -Directory | Where-Object {
              (Test-Path "$($_.FullName)\WindowsDriver.Common.targets") -and (Test-Path "$kits\Include\$($_.Name)\km")
          } | Sort-Object { [version]$_.Name } | Select-Object -Last 1 -ExpandProperty Name
          if (-not $ver) { Write-Error "no WDK found"; exit 1 }
          Write-Host "WDK $ver"
          "WDKVER=$ver" >> $env:GITHUB_ENV
      - name: Build (test-signed)
        shell: pwsh
        run: |
          msbuild SottoVBAN\Scream.vcxproj /p:Configuration=Win10 /p:Platform=${{ matrix.platform }} /p:SpectreMitigation=false /p:WindowsTargetPlatformVersion=$env:WDKVER /m
      - name: Package (driver, test certificate, installer)
        shell: pwsh
        run: |
          $p = "pkg\SottoVBAN-${{ matrix.platform }}"
          New-Item -ItemType Directory -Force $p | Out-Null
          Copy-Item "SottoVBAN\${{ matrix.platform }}\Win10\Scream\*" $p
          Copy-Item "SottoVBAN\${{ matrix.platform }}\Win10\SottoVBAN.cer" $p
          Copy-Item install.bat, install.ps1, uninstall.bat, README.md, LICENSE-MS-PL.txt $p
          Get-ChildItem $p | Format-Table Name, Length
      - name: Install, check the device starts, uninstall (the runner has test signing on)
        if: matrix.platform == 'x64'   # the runner is x64; the ARM64 driver cannot load on it
        shell: pwsh
        run: |
          $ps = "pkg\SottoVBAN-${{ matrix.platform }}\install.ps1"
          powershell -NoProfile -ExecutionPolicy Bypass -File $ps -Ip 127.0.0.1 -Stream CI
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $d = Get-PnpDevice | Where-Object { $_.HardwareID -contains '*SottoVBAN' }
          $d | Format-Table FriendlyName, Status, InstanceId
          if (-not $d -or $d.Status -ne 'OK') { Write-Error "device did not start"; exit 1 }
          Get-CimInstance Win32_SystemDriver -Filter "Name='SottoVBAN'" | Format-Table Name, State, PathName
          powershell -NoProfile -ExecutionPolicy Bypass -File $ps -Uninstall
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (Get-PnpDevice | Where-Object { $_.HardwareID -contains '*SottoVBAN' -and $_.Present }) { Write-Error "device still present"; exit 1 }
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: SottoVBAN-${{ matrix.platform }}
          path: pkg/SottoVBAN-${{ matrix.platform }}
